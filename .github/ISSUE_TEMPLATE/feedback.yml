name: Feedback on a page / Komentar / Отзыв о странице
description: Error, disagreement or a source we missed · Greška, neslaganje, izvor · Ошибка, несогласие, пропущенный источник
labels: ["feedback"]
body:
  - type: input
    id: page
    attributes:
      label: Page / Stranica / Страница
      placeholder: https://mpashka.github.io/pages/...
    validations:
      required: true
  - type: textarea
    id: comment
    attributes:
      label: Comment / Komentar / Комментарий
      description: Any language is fine · Bilo koji jezik · На любом языке. A link to data helps most · Link ka podacima najviše pomaže · Лучше всего помогает ссылка на данные.
    validations:
      required: true
