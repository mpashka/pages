<title>Ko je podigao cene u Srbiji</title>
<meta name="description" content="Da li su ruski migranti 2022. podigli cene stanova u Srbiji? Podaci RGZ, RZS, NBS i Eurostata na srpskom, ruskom i engleskom.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  color-scheme: light;
  --ground: #eef0eb;
  --paper: #f8f9f6;
  --ink: #16232a;
  --ink-2: #4a5a62;
  --ink-3: #6f7d84;
  --rule: #d3d8d1;
  --rule-strong: #aab3ad;
  --signal-ink: #8a5a00;
  --s-blue: #2a78d6;
  --s-aqua: #1baf7a;
  --s-violet: #4a3aa7;
  --s-amber: #eda100;
  --s-slate: #9aa6ad;
  --s-hatch: #c4cbc6;
  --line-ctrl: #a9b3b8;
  --focus: #2a78d6;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #12181b;
    --paper: #182024;
    --ink: #e4eae7;
    --ink-2: #a9b6bb;
    --ink-3: #85949a;
    --rule: #2a353a;
    --rule-strong: #43525a;
    --signal-ink: #e8b04a;
    --s-blue: #3987e5;
    --s-aqua: #199e70;
    --s-violet: #9085e9;
    --s-amber: #c98500;
    --s-slate: #62717a;
    --s-hatch: #3a474d;
    --line-ctrl: #56656c;
    --focus: #6aa8f0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #12181b;
  --paper: #182024;
  --ink: #e4eae7;
  --ink-2: #a9b6bb;
  --ink-3: #85949a;
  --rule: #2a353a;
  --rule-strong: #43525a;
  --signal-ink: #e8b04a;
  --s-blue: #3987e5;
  --s-aqua: #199e70;
  --s-violet: #9085e9;
  --s-amber: #c98500;
  --s-slate: #62717a;
  --s-hatch: #3a474d;
  --line-ctrl: #56656c;
  --focus: #6aa8f0;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 400 16px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }

.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; }
.measure { max-width: 68ch; }

/* top strip */
.strip {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--ground) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--rule);
}
.strip .wrap { display: flex; align-items: center; gap: 16px; min-height: 52px; flex-wrap: wrap; padding-block: 6px; }
.strip nav { display: flex; gap: 4px 14px; flex-wrap: wrap; flex: 1; font-size: 13px; }
.strip nav a { text-decoration: none; color: var(--ink-2); white-space: nowrap; }
.strip nav a:hover { color: var(--ink); }
.lang { display: flex; border: 1px solid var(--rule-strong); border-radius: 999px; overflow: hidden; }
.lang button {
  font: 500 12px/1 var(--font-mono); letter-spacing: .06em;
  background: transparent; color: var(--ink-2); border: 0; padding: 8px 12px; cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }

/* hero */
.hero { padding-block: 44px 20px; }
.eyebrow {
  font: 500 12px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3);
}
h1 {
  font: 700 clamp(30px, 5.4vw, 58px)/1.04 var(--font-display);
  letter-spacing: -.02em; margin: 12px 0 18px; text-wrap: balance; max-width: 18ch;
}
.verdict { font-size: clamp(18px, 2.2vw, 22px); line-height: 1.45; max-width: 46ch; margin: 0; text-wrap: pretty; }
.verdict mark { background: none; color: var(--signal-ink); font-weight: 600; }
.period { margin-top: 14px; font: 400 13px/1.5 var(--font-mono); color: var(--ink-3); }

/* ledger of four donuts */
.ledger {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule);
  margin-block: 28px 12px;
}
@media (max-width: 980px) { .ledger { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .ledger { grid-template-columns: 1fr; } }
.entry { padding: 18px 18px 20px; display: grid; gap: 10px; align-content: start; border-right: 1px solid var(--rule); }
.entry:last-child { border-right: 0; }
@media (max-width: 980px) {
  .entry:nth-child(2n) { border-right: 0; }
  .entry:nth-child(-n+2) { border-bottom: 1px solid var(--rule); }
}
@media (max-width: 560px) { .entry { border-right: 0; border-bottom: 1px solid var(--rule); } .entry:last-child { border-bottom: 0; } }
.entry-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.entry-name { font-weight: 600; font-size: 15px; }
.entry-basis { font: 400 11px/1.3 var(--font-mono); color: var(--ink-3); text-align: right; }
.donut-row { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 14px; align-items: center; }
@media (min-width: 981px) { .donut-row { grid-template-columns: minmax(0, 1fr); justify-items: start; gap: 16px; } }
.entry { min-width: 0; }
.donut { width: 132px; height: 132px; display: block; overflow: visible; }
.donut path { cursor: pointer; transition: opacity .15s; }
.donut:hover path { opacity: .55; }
.donut path:hover, .donut path:focus-visible { opacity: 1; }
.donut .big { font: 700 22px/1 var(--font-display); fill: var(--ink); }
.donut .small { font: 400 10px/1 var(--font-mono); fill: var(--ink-3); }
.keys { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; line-height: 1.3; width: 100%; }
.keys a { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; text-decoration: none; color: var(--ink); }
.keys a:hover .k-name { text-decoration: underline; text-underline-offset: 3px; }
.sw { width: 11px; height: 11px; border-radius: 2px; display: inline-block; transform: translateY(1px); }
.k-val { font: 500 13px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.k-signal .k-name, .k-signal .k-val { color: var(--signal-ink); font-weight: 600; }
.entry-more { font-size: 13px; color: var(--ink-2); }
.note-small { font-size: 13px; color: var(--ink-3); max-width: 80ch; }

/* sections */
section.topic { padding-block: 56px 8px; border-top: 1px solid var(--rule); }
.topic-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; align-items: end; }
@media (max-width: 700px) { .topic-head { grid-template-columns: 1fr; } }
h2 { font: 700 clamp(24px, 3.4vw, 36px)/1.1 var(--font-display); letter-spacing: -.015em; margin: 8px 0 0; text-wrap: balance; }
.topic-figure { font: 700 clamp(32px, 5vw, 52px)/1 var(--font-display); color: var(--ink); text-align: right; }
.topic-figure small { display: block; font: 400 12px/1.4 var(--font-mono); color: var(--ink-3); margin-top: 6px; }
@media (max-width: 700px) { .topic-figure { text-align: left; } }
.lead { font-size: 18px; line-height: 1.55; margin: 18px 0 0; max-width: 64ch; text-wrap: pretty; }

.panel { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 18px 18px 12px; margin-top: 26px; }
.panel h3 { margin: 0; font-size: 15px; font-weight: 600; }
.panel .sub { margin: 2px 0 10px; font: 400 12px/1.5 var(--font-mono); color: var(--ink-3); }
.chart { position: relative; overflow-x: auto; }
.chart svg { display: block; width: 100%; height: auto; min-width: 520px; }
.chart svg text { fill: var(--ink-2); font: 400 11px var(--font-mono); }
.chart .axis line, .chart .grid line { stroke: var(--rule); }
.chart .zero { stroke: var(--rule-strong); }
.chart .pin line { stroke: var(--ink); stroke-dasharray: 3 3; opacity: .55; }
.chart .pin text { fill: var(--ink); font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; margin: 4px 0 8px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
.tip {
  position: absolute; pointer-events: none; background: var(--ink); color: var(--ground);
  font: 400 12px/1.45 var(--font-mono); padding: 8px 10px; border-radius: 4px; white-space: nowrap;
  transform: translate(-50%, calc(-100% - 10px)); z-index: 3;
}
.tip b { font-weight: 500; }

.bars { display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr); gap: 6px 14px; align-items: center; font-size: 13px; }
.bars .b-label { color: var(--ink-2); text-align: right; }
.bars .b-track { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bars .b-bar { height: 14px; border-radius: 0 3px 3px 0; background: var(--s-slate); flex: none; }
.bars .b-val { font: 500 12px/1 var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); }
.bars .hi.b-label { color: var(--ink); font-weight: 600; }
.bars .hi .b-bar { background: var(--ink); }
@media (max-width: 560px) {
  .bars { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .bars .b-label { text-align: left; margin-top: 6px; }
}
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 20px; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } }

/* factors (drill-down) */
.factors { margin-top: 26px; border-top: 2px solid var(--ink); }
details.factor { border-bottom: 1px solid var(--rule); }
details.factor > summary {
  list-style: none; cursor: pointer; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto 18px;
  gap: 12px; align-items: baseline; padding: 14px 2px;
}
details.factor > summary::-webkit-details-marker { display: none; }
.f-name { font-weight: 600; font-size: 16px; }
.f-sum { display: block; font-weight: 400; color: var(--ink-2); font-size: 14px; margin-top: 2px; }
.f-share { font: 700 20px/1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.f-signal .f-share, .f-signal .f-name { color: var(--signal-ink); }
.chev { font: 400 16px/1 var(--font-mono); color: var(--ink-3); transition: transform .15s; }
details[open] > summary .chev { transform: rotate(90deg); }
details.factor:target > summary, details.factor.flash > summary { background: color-mix(in srgb, var(--s-amber) 14%, transparent); }
.evidence { list-style: none; margin: 0 0 16px 26px; padding: 0; display: grid; gap: 10px; max-width: 76ch; }
.evidence li { padding-left: 14px; border-left: 2px solid var(--rule); font-size: 15px; }
.cite { font: 500 11px/1 var(--font-mono); letter-spacing: .02em; text-decoration: none; color: var(--ink-2);
  border: 1px solid var(--rule-strong); border-radius: 3px; padding: 2px 5px; margin-left: 4px; white-space: nowrap; display: inline-block; transform: translateY(-1px); }
.cite:hover { color: var(--ink); border-color: var(--ink); }

/* numbers grid for migrants */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0; margin-top: 26px; border-top: 2px solid var(--ink); }
.fact { padding: 16px 16px 16px 0; border-bottom: 1px solid var(--rule); }
.fact b { display: block; font: 700 26px/1.1 var(--font-display); }
.fact span { display: block; font-size: 14px; color: var(--ink-2); margin-top: 6px; }

/* table */
.tbl-wrap { overflow-x: auto; margin-top: 14px; }
table { border-collapse: collapse; font-size: 14px; min-width: 460px; width: 100%; }
th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font: 500 11px/1.3 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
th.num { text-align: right; }

/* sources */
.sources { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 0; }
.sources li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
@media (max-width: 560px) { .sources li { grid-template-columns: 1fr; gap: 2px; } }
.sources li:target { background: color-mix(in srgb, var(--s-amber) 16%, transparent); }
.src-id { font: 500 12px/1.5 var(--font-mono); color: var(--ink-2); }
.src-kind { font: 500 10px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); border: 1px solid var(--rule-strong); border-radius: 3px; padding: 2px 4px; margin-right: 6px; }
.src-title { overflow-wrap: anywhere; }
.src-back { font: 400 12px var(--font-mono); color: var(--ink-3); margin-left: 6px; }

footer { padding-block: 40px 60px; color: var(--ink-3); font-size: 13px; border-top: 1px solid var(--rule); margin-top: 56px; }
.prose p { max-width: 70ch; margin: 14px 0 0; }
.prose ul { max-width: 70ch; padding-left: 20px; }
.prose li { margin: 6px 0; }
</style>
</head>

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fill = k => k === "hatch" ? "url(#hatch)" : `var(--s-${k})`;
const swatch = k => k === "hatch"
  ? `<span class="sw" style="background:repeating-linear-gradient(45deg,var(--s-hatch) 0 3px,var(--s-slate) 3px 5px)"></span>`
  : `<span class="sw" style="background:var(--s-${k})"></span>`;
let LANG = "sr";
const fmt = (n, d = 0) => n.toLocaleString(LANG === "sr" ? "sr-Latn-RS" : LANG === "ru" ? "ru-RU" : "en-GB", {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = s => (s === 0 ? "≈0" : (s <= 3 && s > 0 && s !== 2 ? "≤" : "") + s) + "%";
const cites = ids => ids.map(id => `<a class="cite" href="#src-${id}" data-src="${id}">${id}</a>`).join("");

/* ---------- donut ---------- */
function donut(topic, total) {
  const f = T[LANG][topic].factors;
  const r = 58, ri = 38, cx = 66, cy = 66;
  let a0 = -Math.PI / 2;
  const sum = f.reduce((s, x) => s + Math.max(x.share, 0), 0);
  const paths = f.filter(x => x.share > 0).map(x => {
    const ang = x.share / sum * Math.PI * 2;
    const gap = 0.025;
    const s = a0 + gap / 2, e = a0 + ang - gap / 2;
    a0 += ang;
    const large = e - s > Math.PI ? 1 : 0;
    const p = (rad, t) => `${cx + rad * Math.cos(t)} ${cy + rad * Math.sin(t)}`;
    const d = `M ${p(r, s)} A ${r} ${r} 0 ${large} 1 ${p(r, e)} L ${p(ri, e)} A ${ri} ${ri} 0 ${large} 0 ${p(ri, s)} Z`;
    return `<path d="${d}" fill="${fill(x.kind)}" tabindex="0" role="link" data-go="${x.id}" aria-label="${esc(x.name)} ${pct(x.share)}"><title>${esc(x.name)} — ${pct(x.share)}</title></path>`;
  }).join("");
  return `<svg class="donut" viewBox="0 0 132 132" role="img" aria-label="${esc(T[LANG].cards[topic].name)} +${total}%">
    ${paths}
    <text class="big" x="${cx}" y="${cy + 4}" text-anchor="middle">+${total}%</text>
    <text class="small" x="${cx}" y="${cy + 20}" text-anchor="middle">${esc(T[LANG].growth)}</text>
  </svg>`;
}

/* ---------- line chart ---------- */
function lineChart(el, {labels, series, yMin, yMax, yStep, pins, fmtY, xTick}) {
  const W = 880, H = 320, m = {l: 48, r: 16, t: 26, b: 30};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const x = i => m.l + i / (labels.length - 1) * iw;
  const y = v => m.t + (1 - (v - yMin) / (yMax - yMin)) * ih;
  let g = `<g class="grid">`;
  for (let v = yMin; v <= yMax + 1e-9; v += yStep) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"></line><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${fmtY(v)}</text>`;
  g += `</g>`;
  let xt = "";
  labels.forEach((lab, i) => { const t = xTick(lab, i); if (t) xt += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${t}</text>`; });
  const pinSvg = (pins || []).map(p => `<g class="pin"><line x1="${x(p.i)}" x2="${x(p.i)}" y1="${m.t - 6}" y2="${m.t + ih}"></line><text x="${x(p.i) + 4}" y="${m.t - 10}">${esc(p.label)}</text></g>`).join("");
  const lines = series.map(s => {
    const d = s.values.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
    const last = s.values.length - 1;
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""}></path>` +
      (s.endLabel ? `<circle cx="${x(last)}" cy="${y(s.values[last])}" r="4" fill="${s.color}" stroke="var(--paper)" stroke-width="2"></circle>` : "");
  }).join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">${g}<line class="zero" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"></line>${xt}${pinSvg}${lines}
    <line class="hair" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--ink-3)" stroke-width="1" visibility="hidden"></line>
    <rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" class="hit"></rect></svg><div class="tip" hidden></div>`;
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), hair = el.querySelector(".hair");
  const move = ev => {
    const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
    const i = Math.max(0, Math.min(labels.length - 1, Math.round((loc.x - m.l) / iw * (labels.length - 1))));
    hair.setAttribute("x1", x(i)); hair.setAttribute("x2", x(i)); hair.setAttribute("visibility", "visible");
    tip.innerHTML = `<b>${esc(labels[i])}</b><br>` + series.filter(s => s.tip !== false).map(s => `${esc(s.name)}: ${fmtY(s.values[i], true)}`).join("<br>");
    const box = svg.getBoundingClientRect(), host = el.getBoundingClientRect();
    tip.style.left = (x(i) / W * box.width + box.left - host.left + el.scrollLeft) + "px";
    tip.style.top = (m.t / H * box.height + 40) + "px";
    tip.hidden = false;
  };
  const hide = () => { tip.hidden = true; hair.setAttribute("visibility", "hidden"); };
  svg.querySelector(".hit").addEventListener("pointermove", move);
  svg.querySelector(".hit").addEventListener("pointerleave", hide);
}

/* ---------- horizontal bars ---------- */
function barChart(el, rows, {max, suffix, highlight}) {
  el.innerHTML = `<div class="bars">` + rows.map(r => {
    const hi = highlight(r) ? "hi" : "";
    return `<span class="b-label ${hi}">${esc(r.label)}</span><span class="b-track ${hi}"><span class="b-bar" style="width:calc((100% - 64px) * ${(r.v / max).toFixed(4)})"></span><span class="b-val">+${fmt(r.v, Number.isInteger(r.v) ? 0 : 1)}${suffix}</span></span>`;
  }).join("") + `</div>`;
}

/* ---------- render ---------- */
const TOTALS = {prices: 45, food: 59, flats: 81, rent: 72};

function factorList(topic) {
  const L = T[LANG];
  return `<div class="factors">` + L[topic].factors.map(f => `
    <details class="factor ${f.kind === "amber" ? "f-signal" : ""}" id="${f.id}">
      <summary>${swatch(f.kind)}<span><span class="f-name">${esc(f.name)}</span><span class="f-sum">${esc(f.sum)}</span></span><span class="f-share">${pct(f.share)}</span><span class="chev" aria-hidden="true">›</span></summary>
      <ul class="evidence">${f.ev.map(([t, s]) => `<li>${esc(t)}${cites(s)}${f.link && !s.length ? ` <a href="#${f.link}">${esc(L.nav[f.link])} →</a>` : ""}</li>`).join("")}</ul>
    </details>`).join("") + `</div>`;
}

function render() {
  const L = T[LANG];
  document.documentElement.lang = LANG === "sr" ? "sr-Latn" : LANG;
  document.title = L.htmlTitle;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  $("#nav").innerHTML = Object.entries(L.nav).map(([k, v]) => `<a href="#${k}">${esc(v)}</a>`).join("");

  const card = topic => `
    <div class="entry">
      <div class="entry-head"><span class="entry-name">${esc(L.cards[topic].name)}</span><span class="entry-basis">${esc(L.cards[topic].basis)}</span></div>
      <div class="donut-row">
        ${donut(topic, TOTALS[topic])}
        <ul class="keys">${L[topic].factors.map(f => `<li class="${f.kind === "amber" ? "k-signal" : ""}"><a href="#${f.id}" data-go="${f.id}">${swatch(f.kind)}<span class="k-name">${esc(f.name)}</span><span class="k-val">${pct(f.share)}</span></a></li>`).join("")}</ul>
      </div>
      <a class="entry-more" href="#${topic}">${esc(L.more)}</a>
    </div>`;

  const topicHead = (id, figure) => `
    <div class="topic-head">
      <div><div class="eyebrow">${esc(L.nav[id])}</div><h2>${esc(L[id].h2)}</h2></div>
      ${figure ? `<div class="topic-figure">+${figure}%<small>${esc(L[id].figureSub)}</small></div>` : ""}
    </div>`;

  $("#app").innerHTML = `
  <section class="hero" id="tldr">
    <div class="eyebrow">${esc(L.eyebrow)}</div>
    <h1>${esc(L.h1)}</h1>
    <p class="verdict">${L.verdict}</p>
    <div class="ledger">${["prices", "food", "flats", "rent"].map(card).join("")}</div>
    <p class="note-small">${esc(L.period)} ${esc(L.signalNote)}</p>
  </section>

/* ---------- navigation: slice → factor → source ---------- */
let lastCite = null;
function openFactor(id) {
  const d = document.getElementById(id);
  if (!d) return;
  d.open = true;
  d.classList.add("flash");
  setTimeout(() => d.classList.remove("flash"), 1600);
  d.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
  history.replaceState(null, "", "#" + id);
}
document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { e.preventDefault(); openFactor(go.dataset.go); return; }
  const c = e.target.closest(".cite");
  if (c) { lastCite = c; return; }
  const back = e.target.closest("[data-back]");
  if (back) { e.preventDefault(); (lastCite || $("#tldr")).scrollIntoView({block: "center"}); lastCite?.focus(); }
  const lb = e.target.closest(".lang button");
  if (lb) setLang(lb.dataset.lang);
});
document.addEventListener("keydown", e => {
  const go = e.target.closest?.("path[data-go]");
  if (go && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openFactor(go.dataset.go); }
});

function setLang(l) {
  LANG = l;
  try { localStorage.setItem("lang", l); } catch (_) {}
  const u = new URL(location.href); u.searchParams.set("lang", l); history.replaceState(null, "", u);
  const keep = location.hash;
  render();
  if (keep && keep.length > 1) { const t = document.getElementById(keep.slice(1)); if (t?.tagName === "DETAILS") t.open = true; }
}

(function start() {
  const q = new URLSearchParams(location.search).get("lang");
  let saved = null; try { saved = localStorage.getItem("lang"); } catch (_) {}
  const nav = (navigator.language || "en").toLowerCase();
  const guess = /^(sr|hr|bs|me|sh)/.test(nav) ? "sr" : /^(ru|uk|be|kk)/.test(nav) ? "ru" : "en";
  LANG = [q, saved, guess].find(x => x && T[x]) || "sr";
  render();
  const h = location.hash.slice(1);
  if (h) { const t = document.getElementById(h); if (t?.tagName === "DETAILS") { t.open = true; t.scrollIntoView(); } }
})();
</script>
